name: Testing on Linux

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  test_all:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["fedora:latest", "fedora:rawhide"]
    container: ${{ matrix.image }}
    # Rawhide may break for reasons of its own; report it, but don't block on it
    continue-on-error: ${{ matrix.image == 'fedora:rawhide' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: dnf install -y erlang-erts gcc make python3-pybeam python3-pyelftools python3-rpm
      - name: Run tests
        run: make check
